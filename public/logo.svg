<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DF9E" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#85580F" />
    </linearGradient>
    <linearGradient id="dark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081B21" />
      <stop offset="50%" stop-color="#0E2B33" />
      <stop offset="100%" stop-color="#040D10" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#dark-grad)" stroke="url(#gold-grad)" stroke-width="8" filter="url(#shadow)"/>

  <!-- Inner Double Ring -->
  <rect x="44" y="44" width="424" height="424" rx="76" fill="none" stroke="url(#gold-grad)" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="8 6"/>

  <!-- Islamic Arch Portal Geometry -->
  <path d="M 160 380 L 160 250 C 160 170 256 120 256 120 C 256 120 352 170 352 250 L 352 380 Z" fill="url(#glow-grad)" stroke="url(#gold-grad)" stroke-width="4"/>

  <!-- Decorative Minaret / Finial Crescent and Star on Top -->
  <path d="M 256 76 L 256 120" stroke="url(#gold-grad)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="256" cy="72" r="8" fill="url(#gold-grad)"/>
  <path d="M 256 50 C 248 50 242 56 242 64 C 242 72 248 78 256 78 C 253 75 251 70 251 64 C 251 58 253 53 256 50 Z" fill="url(#gold-grad)"/>
  
  <!-- Architectural Multi-tier Arches -->
  <path d="M 190 380 L 190 265 C 190 205 256 170 256 170 C 256 170 322 205 322 265 L 322 380" fill="none" stroke="url(#gold-grad)" stroke-width="2.5" stroke-opacity="0.75"/>

  <!-- Stylized Elegant "IGH" Monogram -->
  <g id="igh-monogram" fill="url(#gold-grad)">
    <!-- Letter I -->
    <rect x="210" y="240" width="12" height="70" rx="3"/>
    <rect x="202" y="234" width="28" height="8" rx="2"/>
    <rect x="202" y="306" width="28" height="8" rx="2"/>

    <!-- Letter G (Stylized Arch) -->
    <path d="M 276 240 C 254 240 240 255 240 275 C 240 295 254 310 276 310 C 294 310 304 298 304 284 L 274 284 L 274 274 L 316 274 L 316 286 C 316 306 300 320 276 320 C 248 320 228 300 228 275 C 228 250 248 230 276 230 C 294 230 308 238 316 250 L 306 258 C 300 248 290 240 276 240 Z"/>

    <!-- Letter H -->
    <rect x="330" y="234" width="12" height="80" rx="3"/>
    <rect x="360" y="234" width="12" height="80" rx="3"/>
    <rect x="330" y="270" width="42" height="10" rx="2"/>
  </g>

  <!-- Stars flanking the Arch -->
  <polygon points="120,240 124,252 136,252 126,260 130,272 120,264 110,272 114,260 104,252 116,252" fill="url(#gold-grad)"/>
  <polygon points="392,240 396,252 408,252 398,260 402,272 392,264 382,272 386,260 376,252 388,252" fill="url(#gold-grad)"/>

  <!-- Base Ribbon Plinth -->
  <path d="M 120 400 L 392 400 L 372 425 L 140 425 Z" fill="url(#gold-grad)"/>
  <text x="256" y="418" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="14" font-weight="900" fill="#081B21" text-anchor="middle" letter-spacing="4">DHANMONDI • DHAKA</text>

  <!-- Corner arabesque flourish dots -->
  <circle cx="80" cy="80" r="4" fill="url(#gold-grad)"/>
  <circle cx="432" cy="80" r="4" fill="url(#gold-grad)"/>
  <circle cx="80" cy="432" r="4" fill="url(#gold-grad)"/>
  <circle cx="432" cy="432" r="4" fill="url(#gold-grad)"/>
</svg>
